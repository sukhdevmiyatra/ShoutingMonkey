[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sukhdev Miyatra <sukhdevmiyatra2@gmail.com>"]
license = "MIT"
repository = "https://github.com/sukhdevmiyatra/ShoutingMonkey"
description = "Free, open-source SEO spider for Windows: crawl a website and audit it for 100+ technical SEO issues. A lightweight Screaming Frog alternative in one portable exe."
keywords = ["seo", "crawler", "seo-spider", "site-audit", "screaming-frog-alternative"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
encoding_rs = "0.8"
chromiumoxide = "0.9"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
url = "2"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
scraper = "0.20"
quick-xml = "0.36"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true