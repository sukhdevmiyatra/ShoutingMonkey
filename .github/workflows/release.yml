name: Release

# Push a tag such as v0.1.0 to build the executables and attach them to a
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/ShoutingMonkey.exe
            dist/shoutingmonkey-cli.exe
            dist/THIRD_PARTY_LICENSES.txt
